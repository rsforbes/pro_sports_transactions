# Release — versioning, changelog, GitHub releases, and PyPI publishing via
# release-please (https://github.com/googleapis/release-please).
#
# On every push to main, release-please reads the Conventional Commit subjects
# merged since the last release (squash-merged PR titles, see CONTRIBUTING.md)
# and keeps a single "chore(main): release X.Y.Z" pull request open. That PR
# bumps the version in pyproject.toml and uv.lock and prepends the generated
# notes to CHANGELOG.md. `feat` bumps the minor version, `fix`/`perf` the patch,
# and `!` / `BREAKING CHANGE:` the major. Merging the PR tags vX.Y.Z, creates
# the GitHub release, and then the jobs below build and publish to PyPI.
# Settings: release-please-config.json; current version:
# .release-please-manifest.json.
#
# release-please authenticates as a GitHub App, not with GITHUB_TOKEN: pull
# requests opened with GITHUB_TOKEN don't trigger workflows, so the release PR
# would never get the required CI / PR Title / CodeQL checks and couldn't be
# merged. The app needs Contents, Pull requests, and Issues (labels) read/write
# on this repository; its client ID is the RELEASE_APP_CLIENT_ID secret and
# its key the RELEASE_APP_PRIVATE_KEY secret.
#
# PyPI publishing uses Trusted Publishing (OIDC), so no API token is stored.
# The PyPI trusted publisher is bound to this file name (release.yml) and the
# `pypi` environment: renaming either breaks publishing until PyPI is updated.
# The publish action also generates PEP 740 attestations for the uploads.
#
# Building and publishing are separate jobs so the job holding id-token: write
# runs no project code; the build job has only read access.

name: Release

on:
  push:
    branches: [main]

permissions: {}

# Never run two release-please passes at once (they'd race on the release PR),
# and never cancel one mid-release.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release PR / tag
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - name: Get GitHub App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    name: Build distributions
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          python-version: '3.11'
          # No cache in a release build: a cache written by another workflow
          # could otherwise inject content into the published artifacts.
          enable-cache: false
      - name: Build sdist and wheel
        run: uv build
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pro_sports_transactions/
    permissions:
      id-token: write # Trusted Publishing (OIDC) + attestations
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2

  # Attach the same files to the GitHub release, after PyPI accepted them.
  upload-release-assets:
    name: Attach distributions to GitHub release
    needs: [release-please, publish-pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/*
