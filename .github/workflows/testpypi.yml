# TestPyPI — an optional, manual release candidate: build the chosen ref,
# publish it to TestPyPI, install it from there into clean venvs, and run the
# README Quick Start against it.
#
# When to use it: before a release that changes packaging, dependencies, or the
# `nodriver` extra, where "the tests pass from the source tree" isn't the same
# as "the published package installs and works". Small fixes can skip it and
# release directly (release.yml).
#
# How: Actions > TestPyPI > Run workflow, and pick the branch or tag to test.
# Each run publishes `<next patch>.dev<run number>` (e.g. 1.1.3.dev7): TestPyPI
# never accepts the same file twice, and a dev version can't collide with a
# real release. To retry a failure, use "Re-run failed jobs": it keeps the
# version, and the upload skips files TestPyPI already has (skip-existing), so
# a partly failed upload can be resumed. The smoke test checks the downloaded
# files against this run's build hashes, so a skipped upload can never let it
# test something else.
#
# Supply chain: the smoke test never points a resolver at TestPyPI, where
# anyone can upload any name (dependency confusion). It downloads only this
# version's files through TestPyPI's JSON API, checks their sha256 against the
# ones built here, and installs them with every dependency from PyPI. Building
# and publishing are separate jobs, as in release.yml, so the job holding
# id-token: write runs no project code.
#
# One-time setup (repository admin):
# 1. GitHub: Settings > Environments > New environment named `testpypi`.
# 2. test.pypi.org (a separate account from pypi.org): the project already
#    exists there (0.1.0, uploaded by hand), so open Your projects >
#    pro-sports-transactions > Manage > Publishing and add a GitHub trusted
#    publisher: owner `rsforbes`, repository `pro_sports_transactions`,
#    workflow `testpypi.yml`, environment `testpypi`.
# Renaming this file or the environment breaks publishing until TestPyPI is
# updated to match.

name: TestPyPI

on:
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      wheel_sha256: ${{ steps.build.outputs.wheel_sha256 }}
      sdist_sha256: ${{ steps.build.outputs.sdist_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
          # No cache in a build that gets published (see release.yml).
          enable-cache: false
      # --frozen edits pyproject.toml only; uv.lock keeps the released version,
      # which doesn't affect the built distributions.
      - name: Set a dev version
        id: version
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          version=$(uv version --frozen --bump patch --bump "dev=${RUN_NUMBER}" --short)
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Building ${version}"
      - name: Build sdist and wheel
        id: build
        run: |
          uv build
          echo "wheel_sha256=$(sha256sum dist/*.whl | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "sdist_sha256=$(sha256sum dist/*.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/pro_sports_transactions/${{ needs.build.outputs.version }}/
    permissions:
      id-token: write # Trusted Publishing (OIDC) + attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true # resume a partly failed upload on re-run

  smoke:
    name: Install from TestPyPI and run the Quick Start
    needs: [build, publish-testpypi]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.build.outputs.version }}
      WHEEL_SHA256: ${{ needs.build.outputs.wheel_sha256 }}
      SDIST_SHA256: ${{ needs.build.outputs.sdist_sha256 }}
    steps:
      # For the smoke script and its parse fixture; the package under test
      # comes from TestPyPI.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.11'
          enable-cache: false
      # A new upload can take a minute or two to appear.
      - name: Download the distributions from TestPyPI
        run: |
          url="https://test.pypi.org/pypi/pro_sports_transactions/${VERSION}/json"
          for _ in $(seq 30); do
            curl -fsSL "$url" -o release.json && break
            sleep 10
          done
          if [ ! -s release.json ]; then
            echo "::error::${VERSION} did not appear on TestPyPI within 5 minutes"
            exit 1
          fi
          mkdir dist
          for type in bdist_wheel sdist; do
            file_url=$(jq -er --arg t "$type" '.urls[] | select(.packagetype == $t) | .url' release.json)
            curl -fsSL "$file_url" -o "dist/$(basename "$file_url")"
          done
          sha256sum --check <<EOF
          ${WHEEL_SHA256}  $(ls dist/*.whl)
          ${SDIST_SHA256}  $(ls dist/*.tar.gz)
          EOF
      # Dependencies (and the sdist's build backend) from PyPI only;
      # --no-config ignores the checkout's uv settings. The base venv installs
      # the sdist, so it's built and tested too; the nodriver venv the wheel.
      - name: Install into clean venvs
        run: |
          sdist="$(realpath dist/*.tar.gz)"
          wheel="$(realpath dist/*.whl)"
          uv venv --no-config venv-base
          uv pip install --no-config --python venv-base --index-url https://pypi.org/simple/ \
            "pro_sports_transactions @ file://${sdist}"
          uv venv --no-config venv-nodriver
          uv pip install --no-config --python venv-nodriver --index-url https://pypi.org/simple/ \
            "pro_sports_transactions[nodriver] @ file://${wheel}"
      - name: Smoke test without extras
        run: venv-base/bin/python -I .github/scripts/testpypi_smoke.py base
      - name: Install a virtual display
        run: command -v xvfb-run || { sudo apt-get update && sudo apt-get install -y xvfb; }
      - name: Smoke test with the nodriver extra
        run: |
          # Pin Chrome: auto-detect would pick a shorter-path Chromium if the
          # runner image has one, and Chromium failed in testing.
          CHROME_PATH="$(command -v google-chrome)"
          export CHROME_PATH
          echo "browser: ${CHROME_PATH}"
          xvfb-run -a venv-nodriver/bin/python -I .github/scripts/testpypi_smoke.py nodriver
